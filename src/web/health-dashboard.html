
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health - Trading Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container-fluid mt-4">
        <h2 class="mb-4">System Health Dashboard</h2>

        <!-- Overall Status -->
        <div id="overall-status-banner" class="alert alert-secondary" role="alert">
            <h4 class="alert-heading">Overall Status: <span id="overall-status-text">Checking...</span></h4>
        </div>

        <!-- Key Metrics -->
        <div class="row mb-4">
            <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="card-subtitle mb-2 text-muted">Balance Discrepancies</h6><h2 class="card-title" id="metric-discrepancies">-</h2></div></div></div>
            <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="card-subtitle mb-2 text-muted">Untracked Positions</h6><h2 class="card-title" id="metric-untracked">-</h2></div></div></div>
            <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="card-subtitle mb-2 text-muted">Pending Orders</h6><h2 class="card-title" id="metric-pending">-</h2></div></div></div>
            <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="card-subtitle mb-2 text-muted">Active Strategies</h6><h2 class="card-title" id="metric-strategies">-</h2></div></div></div>
        </div>

        <!-- Component Status -->
        <div class="card mb-4">
            <div class="card-header"><h4>Component Status</h4></div>
            <div class="card-body">
                <div id="component-status-container" class="list-group">
                    <!-- Status items will be injected here -->
                </div>
            </div>
        </div>

        <!-- Recent Alerts -->
        <div class="card">
            <div class="card-header"><h4>Recent Alerts</h4></div>
            <div class="card-body">
                <ul id="recent-alerts-list" class="list-group list-group-flush">
                    <!-- Alerts will be injected here -->
                </ul>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/health-dashboard.js"></script>
</body>
</html>
