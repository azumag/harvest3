<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>約定履歴 - 取引データ閲覧</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Datepicker CSS (flatpickrを使用する場合) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <!-- ナビゲーションバーコンテナ -->
    <div id="navbar-container"></div>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">
        <h2>約定履歴</h2>

        <!-- フィルタエリア -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">フィルタ</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="filter-exchange" class="form-label">取引所</label>
                        <select id="filter-exchange" class="form-select">
                            <option value="">すべて</option>
                            <!-- 取引所オプションはJSで動的に追加 -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filter-symbol" class="form-label">銘柄</label>
                        <select id="filter-symbol" class="form-select">
                            <option value="">すべて</option>
                            <!-- 銘柄オプションはJSで動的に追加 -->
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-side" class="form-label">売買区分</label>
                        <select id="filter-side" class="form-select">
                            <option value="">すべて</option>
                            <option value="buy">買</option>
                            <option value="sell">売</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-start-date" class="form-label">開始日</label>
                        <input type="text" id="filter-start-date" class="form-control datepicker" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="col-md-2">
                        <label for="filter-end-date" class="form-label">終了日</label>
                        <input type="text" id="filter-end-date" class="form-control datepicker" placeholder="YYYY-MM-DD">
                    </div>
                </div>
                <div class="mt-3">
                    <button id="apply-filter" class="btn btn-primary">フィルタ適用</button>
                </div>
            </div>
        </div>

        <!-- 約定履歴テーブル -->
        <div class="card">
            <div class="card-body">
                <table id="trades-table" class="table table-striped table-bordered" style="width:100%">
                    <thead>
                        <tr>
                            <th>取引所</th>
                            <th>銘柄</th>
                            <th>売買区分</th>
                            <th>価格</th>
                            <th>数量</th>
                            <th>約定ID</th>
                            <th>注文ID</th>
                            <th>注文タイプ</th>
                            <th>手数料</th>
                            <th>タイムスタンプ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- データはJSで動的に追加 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/dataTables.bootstrap5.min.js"></script>
    <!-- Datepicker JS (flatpickrを使用する場合) -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>

    <!-- カスタムJavaScript -->
    <script src="js/navbar.js"></script>
    <script src="js/trade-history.js"></script>
</body>
</html>
