<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戦略パラメータ設定 - Harvest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ナビゲーションバー -->
    <div id="navbar-container"></div>

    <div class="container mt-4">
        <h1>戦略パラメータ設定</h1>
        
        <!-- タブコンテナ -->
        <ul class="nav nav-tabs" id="paramTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="by-symbol-tab" data-bs-toggle="tab" data-bs-target="#by-symbol" type="button" role="tab">銘柄別</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="by-strategy-tab" data-bs-toggle="tab" data-bs-target="#by-strategy" type="button" role="tab">戦略別</button>
            </li>
        </ul>

        <!-- タブコンテンツ -->
        <div class="tab-content" id="paramTabsContent">
            <!-- 銘柄別タブ -->
            <div class="tab-pane fade show active" id="by-symbol" role="tabpanel">
                <div class="card">
                    <div class="card-body">
                        <div id="symbol-params-container">
                            <p class="text-muted">取引所と銘柄を選択してください。</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 戦略別タブ -->
            <div class="tab-pane fade" id="by-strategy" role="tabpanel">
                <div class="card">
                    <div class="card-body">
                        <div id="strategy-params-container">
                            <p class="text-muted">取引所と戦略を選択してください。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 保存ボタン -->
        <div class="mt-4">
            <button id="save-btn" class="btn btn-primary" disabled>パラメータを保存</button>
        </div>

        <!-- フィードバック表示エリア -->
        <div id="feedback-container" class="mt-3">
            <!-- ここにアラートメッセージを表示 -->
        </div>
    </div>

    <!-- ローディング表示 -->
    <div id="loading-overlay" class="d-none">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">読み込み中...</span>
        </div>
    </div>

    <!-- スクリプト -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/parameter-settings.js"></script>
</body>
</html>
