<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取引データ閲覧 - ダッシュボード</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- ナビゲーションバーコンテナ -->
    <div id="navbar-container"></div>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">
        <!-- 取引サマリーセクション -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card summary-card">
                    <div class="card-body">
                        <h5 class="card-title">取引サマリー</h5>
                        <div id="summary-loading" class="text-center py-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">読み込み中...</span>
                            </div>
                        </div>
                        <div id="summary-container" class="d-none">
                            <!-- タブヘッダー -->
                            <ul class="nav nav-tabs" id="summaryTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="exchange-tab" data-bs-toggle="tab" data-bs-target="#exchange-tab-pane" type="button" role="tab" aria-controls="exchange-tab-pane" aria-selected="true">取引所別</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="symbol-tab" data-bs-toggle="tab" data-bs-target="#symbol-tab-pane" type="button" role="tab" aria-controls="symbol-tab-pane" aria-selected="false">銘柄別</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="strategy-tab" data-bs-toggle="tab" data-bs-target="#strategy-tab-pane" type="button" role="tab" aria-controls="strategy-tab-pane" aria-selected="false">戦略別</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="order-pairs-tab" data-bs-toggle="tab" data-bs-target="#order-pairs-tab-pane" type="button" role="tab" aria-controls="order-pairs-tab-pane" aria-selected="false">注文ペア</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="available-amounts-tab" data-bs-toggle="tab" data-bs-target="#available-amounts-tab-pane" type="button" role="tab" aria-controls="available-amounts-tab-pane" aria-selected="false">購入可能額</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="risk-management-tab" data-bs-toggle="tab" data-bs-target="#risk-management-tab-pane" type="button" role="tab" aria-controls="risk-management-tab-pane" aria-selected="false">リスク管理</button>
                                </li>
                            </ul>
                            <!-- タブコンテンツ -->
                            <div class="tab-content" id="summaryTabsContent">
                                <!-- 取引所別サマリーペイン -->
                                <div class="tab-pane fade show active" id="exchange-tab-pane" role="tabpanel" aria-labelledby="exchange-tab" tabindex="0">
                                    <div class="mt-3">
                                        <div id="exchange-summary-container" class="summary-cards row"></div>
                                    </div>
                                </div>
                                <!-- 銘柄別サマリーペイン -->
                                <div class="tab-pane fade" id="symbol-tab-pane" role="tabpanel" aria-labelledby="symbol-tab" tabindex="0">
                                    <div class="mt-3">
                                        <div id="symbol-summary-container" class="summary-cards row"></div>
                                    </div>
                                </div>
                                <!-- 戦略別サマリーペイン -->
                                <div class="tab-pane fade" id="strategy-tab-pane" role="tabpanel" aria-labelledby="strategy-tab" tabindex="0">
                                    <div class="mt-3">
                                        <div id="strategy-summary-container" class="summary-cards row"></div>
                                    </div>
                                </div>
                                <!-- 注文ペアサマリーペイン -->
                                <div class="tab-pane fade" id="order-pairs-tab-pane" role="tabpanel" aria-labelledby="order-pairs-tab" tabindex="0">
                                    <div class="mt-3">
                                        <!-- 全体統合サマリーセクション -->
                                        <div class="mb-4">
                                            <h6 class="border-bottom pb-2">全体統合サマリー</h6>
                                            <div id="overall-summary-container" class="row">
                                                <!-- 統合サマリーがここに表示される -->
                                            </div>
                                        </div>
                                        
                                        <!-- 注文ペアサマリーの既存HTMLをここに戻す -->
                                        <div class="mb-4">
                                            <h6 class="border-bottom pb-2 d-flex justify-content-between align-items-center">
                                                <span>注文ペアサマリー</span>
                                                <div class="d-flex align-items-center">
                                                    <label for="order-pair-symbol-filter" class="me-2 small">銘柄:</label>
                                                    <select id="order-pair-symbol-filter" class="form-select form-select-sm" style="width: auto;">
                                                        <option value="all">すべて表示</option>
                                                    </select>
                                                </div>
                                            </h6>
                                            <div id="order-pairs-summary-container" class="summary-cards row"></div>
                                        </div>
                                    </div>
                                </div>
                                <!-- 購入可能額ペイン -->
                                <div class="tab-pane fade" id="available-amounts-tab-pane" role="tabpanel" aria-labelledby="available-amounts-tab" tabindex="0">
                                    <div class="mt-3">
                                        <div id="available-amounts-container" class="summary-cards row"></div>
                                    </div>
                                </div>
                                <!-- リスク管理ペイン -->
                                <div class="tab-pane fade" id="risk-management-tab-pane" role="tabpanel" aria-labelledby="risk-management-tab" tabindex="0">
                                    <div class="mt-3">
                                        <!-- リスク管理統計情報 -->
                                        <div class="row mb-4">
                                            <div class="col-12">
                                                <div class="card">
                                                    <div class="card-body">
                                                        <h6 class="card-title">リスク管理統計</h6>
                                                        <div id="risk-stats-container">
                                                            <div class="text-center py-3">
                                                                <div class="spinner-border text-primary" role="status">
                                                                    <span class="visually-hidden">読み込み中...</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- リスク管理ポジション一覧 -->
                                        <div class="row">
                                            <div class="col-12">
                                                <div class="card">
                                                    <div class="card-body">
                                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                                            <h6 class="card-title mb-0">リスク管理ポジション</h6>
                                                            <button class="btn btn-sm btn-outline-primary" onclick="refreshRiskPositions()">
                                                                <i class="bi bi-arrow-clockwise"></i> 更新
                                                            </button>
                                                        </div>
                                                        <div id="risk-positions-container">
                                                            <div class="text-center py-3">
                                                                <div class="spinner-border text-primary" role="status">
                                                                    <span class="visually-hidden">読み込み中...</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

<!-- 日次損益セクション -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card daily-pnl-card">
            <div class="card-body">
                <h5 class="card-title">過去24時間の日次損益</h5>
                <div id="daily-pnl-loading" class="text-center py-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">読み込み中...</span>
                    </div>
                </div>
                <div id="daily-pnl-container" class="d-none">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>売った額:</strong> <span id="total-sell-amount">-</span></p>
                            <p><strong>買った額:</strong> <span id="total-buy-amount">-</span></p>
                            <p><strong>損益:</strong> <span id="profit-loss">-</span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>手数料:</strong> <span id="total-fee">-</span></p>
                            <p><strong>買った回数:</strong> <span id="buy-count">-</span></p>
                            <p><strong>売った回数:</strong> <span id="sell-count">-</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/dataTables.bootstrap5.min.js"></script>

    <!-- カスタムJavaScript -->
    <script src="js/navbar.js"></script>
    <!-- <script src="js/realtime.js"></script> -->
    <script>
      // Chart.jsが読み込まれたか確認
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof Chart !== 'undefined') {
          console.log('Chart.jsが正常に読み込まれました');
        } else {
          console.error('Chart.jsの読み込みに失敗しました');
        }
      });
    </script>
    <script src="js/dashboard.js"></script>
</body>
</html>
