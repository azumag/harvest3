<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取引データ閲覧 - ダッシュボード</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body>
    <!-- ナビゲーションバーコンテナ -->
    <div id="navbar-container"></div>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">
        <!-- 取引サマリーセクション -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card summary-card">
                    <div class="card-body">
                        <h5 class="card-title">取引サマリー</h5>
                        <div id="summary-loading" class="text-center py-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">読み込み中...</span>
                            </div>
                        </div>
                        <div id="summary-container" class="d-none">
                            <!-- 取引所別サマリー -->
                            <div class="mb-4">
                                <h6 class="border-bottom pb-2">取引所別サマリー</h6>
                                <div id="exchange-summary-container" class="summary-cards row"></div>
                            </div>
                            
                            <!-- 戦略別サマリー -->
                            <div class="mb-4">
                                <h6 class="border-bottom pb-2">戦略別サマリー</h6>
                                <div id="strategy-summary-container" class="summary-cards row"></div>
                            </div>
                            
                            <!-- 注文ペアサマリー -->
                            <div class="mb-4">
                                <h6 class="border-bottom pb-2 d-flex justify-content-between align-items-center">
                                    <span>注文ペアサマリー</span>
                                    <div class="d-flex align-items-center">
                                        <label for="order-pair-symbol-filter" class="me-2 small">銘柄:</label>
                                        <select id="order-pair-symbol-filter" class="form-select form-select-sm" style="width: auto;">
                                            <option value="all">すべて表示</option>
                                        </select>
                                    </div>
                                </h6>
                                <div id="order-pairs-summary-container" class="summary-cards row"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/dataTables.bootstrap5.min.js"></script>

    <!-- カスタムJavaScript -->
    <script src="js/navbar.js"></script>
    <!-- <script src="js/realtime.js"></script> -->
    <script>
      // Chart.jsが読み込まれたか確認
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof Chart !== 'undefined') {
          console.log('Chart.jsが正常に読み込まれました');
        } else {
          console.error('Chart.jsの読み込みに失敗しました');
        }
      });
    </script>
    <script src="js/dashboard.js"></script>
</body>
</html>
