<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取引データ閲覧 - 注文ペア</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- データテーブル拡張機能 -->
    <link href="https://cdn.datatables.net/buttons/2.3.5/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <!-- 注文ペアテーブル用スタイル -->
    <style>
        #order-pairs-table th, #order-pairs-table td {
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #order-pairs-table th:nth-child(1), #order-pairs-table td:nth-child(1) { max-width: 100px; } /* ID */
        #order-pairs-table th:nth-child(2), #order-pairs-table td:nth-child(2) { max-width: 80px; } /* 取引所 */
        #order-pairs-table th:nth-child(3), #order-pairs-table td:nth-child(3) { max-width: 80px; } /* 通貨ペア */
        #order-pairs-table th:nth-child(4), #order-pairs-table td:nth-child(4) { max-width: 100px; } /* 戦略 */
        #order-pairs-table th:nth-child(5), #order-pairs-table td:nth-child(5) { max-width: 70px; } /* 数量 */
        #order-pairs-table th:nth-child(6), #order-pairs-table td:nth-child(6) { max-width: 100px; } /* 買い注文ID */
        #order-pairs-table th:nth-child(10), #order-pairs-table td:nth-child(10) { max-width: 100px; } /* 売り注文ID */
        
        /* ホバー時にツールチップのように全文表示 */
        #order-pairs-table td:hover {
            white-space: normal;
            overflow: visible;
            position: relative;
            z-index: 1;
            background-color: #f8f9fa;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">取引データ閲覧</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">ダッシュボード</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="positions.html">ポジション</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">注文履歴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="filled-history.html">約定履歴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="order-pairs.html">注文ペア</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="analysis.html">分析</a>
                    </li>
                </ul>
            </div>
            <div id="realtime-status" class="text-light">
                <span class="badge bg-secondary">オフライン</span>
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">

        <!-- フィルター -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">検索フィルター</h5>
                        <form id="order-pairs-filter-form">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="exchange-filter" class="form-label">取引所</label>
                                    <select id="exchange-filter" class="form-select" required>
                                        <option value="">選択してください</option>
                                        <!-- APIから取得したデータがここに表示されます -->
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="symbol-filter" class="form-label">銘柄</label>
                                    <select id="symbol-filter" class="form-select" required>
                                        <option value="">選択してください</option>
                                        <!-- APIから取得したデータがここに表示されます -->
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="strategy-filter" class="form-label">戦略</label>
                                    <select id="strategy-filter" class="form-select" required>
                                        <option value="">選択してください</option>
                                        <!-- APIから取得したデータがここに表示されます -->
                                    </select>
                                </div>
                                <div class="col-md-12 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary me-2">検索</button>
                                    <button type="reset" class="btn btn-secondary">リセット</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 注文ペアテーブル -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">注文ペア</h5>
                        <div class="table-responsive">
                            <table id="order-pairs-table" class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>取引所</th>
                                        <th>通貨ペア</th>
                                        <th>戦略</th>
                                        <th>数量</th>
                                        <th>買い注文ID</th>
                                        <th>買い注文日時</th>
                                        <th>買い注文価格</th>
                                        <th>買い注文状態</th>
                                        <th>売り注文ID</th>
                                        <th>売り注文日時</th>
                                        <th>売り注文価格</th>
                                        <th>売り注文状態</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- APIから取得したデータがここに表示されます -->
                                    <tr>
                                        <td colspan="13" class="text-center">取引所、銘柄、戦略を選択してください</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.5/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.5/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.5/js/buttons.html5.min.js"></script>

    <!-- カスタムJavaScript -->
    <script src="js/realtime.js"></script>
    <script src="js/order-pairs.js"></script>
</body>
</html>
