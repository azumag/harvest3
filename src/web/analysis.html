<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析 - 取引データ閲覧</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Datepicker CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <!-- ナビゲーションバーコンテナ -->
    <div id="navbar-container"></div>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">
        <h2>分析</h2>

        <!-- フィルタエリア -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">フィルタ</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="filter-parameter-set" class="form-label">戦略パラメータセット</label>
                        <select id="filter-parameter-set" class="form-select">
                            <option value="">パラメータセットを選択</option>
                            <!-- パラメータセットはJSで動的に追加 -->
                        </select>
                    </div>
                    <div id="parameter-info" class="mt-3">
                        <div class="alert alert-info">
                            <p><strong>選択情報:</strong></p>
                            <p>取引所: <span id="selected-exchange">未選択</span></p>
                            <p>銘柄: <span id="selected-symbol">未選択</span></p>
                            <p>時間足: <span id="selected-timeframe">自動設定</span></p>
                            <p>表示数: <span id="selected-limit">自動設定</span></p>
                        </div>
                    </div>

                    <div class="col-md-3">
                    <div class="col-md-2">
                    <div class="col-md-3">
                        <label for="filter-start-date" class="form-label">基準日</label>
                        <input type="text" id="filter-start-date" class="form-control datepicker" placeholder="YYYY-MM-DD" value="">
                    </div>
                    <div class="col-md-3">
                </div>
                <div class="mt-3">
                    <button id="apply-filter" class="btn btn-primary">表示</button>
                </div>
            </div>
        </div>

        <!-- チャート表示エリア -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">チャート</h5>
                <div id="chart-container" style="height: 600px;">
                    <canvas id="ohlcvChart" width="1200" height="600"></canvas>
                </div>
                <div id="chart-loading" class="text-center py-3 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">読み込み中...</span>
                    </div>
                </div>
                <div id="chart-error" class="alert alert-danger mt-3 d-none">
                    データを取得できませんでした。入力条件を確認してください。
                </div>
                <div id="no-data-message" class="alert alert-info mt-3 d-none">
                    選択した条件のデータが見つかりません。
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@2.0.2/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.0.0/dist/chartjs-adapter-luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>

    <!-- カスタムJavaScript -->
    <script src="js/navbar.js"></script>
    <script src="js/analysis.js"></script>
</body>
</html>
