<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析 - 取引データ閲覧</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Datepicker CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <!-- ナビゲーションバーコンテナ -->
    <div id="navbar-container"></div>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">
        <h2>分析</h2>

        <!-- フィルタエリア -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">フィルタ</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="filter-exchange" class="form-label">取引所</label>
                        <select id="filter-exchange" class="form-select">
                            <option value="">取引所を選択</option>
                            <!-- 取引所オプションはJSで動的に追加 -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filter-symbol" class="form-label">銘柄</label>
                        <select id="filter-symbol" class="form-select">
                            <option value="">銘柄を選択</option>
                            <!-- 銘柄オプションはJSで動的に追加 -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filter-strategy" class="form-label">戦略</label>
                        <select id="filter-strategy" class="form-select">
                            <option value="">戦略を選択</option>
                            <!-- 戦略オプションはJSで動的に追加、または静的に設定 -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filter-timeframe" class="form-label">時間足</label>
                        <select id="filter-timeframe" class="form-select">
                            <option value="1m">1分</option>
                            <option value="5m">5分</option>
                            <option value="15m">15分</option>
                            <option value="30m">30分</option>
                            <option value="1h" selected>1時間</option>
                            <option value="4h">4時間</option>
                            <option value="1d">1日</option>
                            <option value="1w">1週間</option>
                        </select>
                    </div>
                </div>
                <div class="row g-3 mt-1">
                    <div class="col-md-3">
                        <label for="filter-start-date" class="form-label">開始日</label>
                        <input type="text" id="filter-start-date" class="form-control datepicker" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="col-md-3">
                        <label for="filter-end-date" class="form-label">終了日</label>
                        <input type="text" id="filter-end-date" class="form-control datepicker" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="col-md-3">
                        <label for="filter-limit" class="form-label">表示数</label>
                        <select id="filter-limit" class="form-select">
                            <option value="50">50件</option>
                            <option value="100" selected>100件</option>
                            <option value="200">200件</option>
                            <option value="500">500件</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3">
                    <button id="apply-filter" class="btn btn-primary">表示</button>
                </div>
            </div>
        </div>

        <!-- チャート表示エリア -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">チャート</h5>
                <div id="chart-container" style="height: 600px;">
                    <canvas id="ohlcvChart"></canvas>
                </div>
                <div id="chart-loading" class="text-center py-3 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">読み込み中...</span>
                    </div>
                </div>
                <div id="chart-error" class="alert alert-danger mt-3 d-none">
                    データを取得できませんでした。入力条件を確認してください。
                </div>
                <div id="no-data-message" class="alert alert-info mt-3 d-none">
                    選択した条件のデータが見つかりません。
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@2.0.2/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.0.0/dist/chartjs-adapter-luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>

    <!-- カスタムJavaScript -->
    <script src="js/navbar.js"></script>
    <script src="js/analysis.js"></script>
</body>
</html>
