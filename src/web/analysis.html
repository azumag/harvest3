<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取引データ閲覧 - 分析</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">取引データ閲覧</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">ダッシュボード</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="positions.html">ポジション</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">取引履歴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="filled-history.html">約定履歴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="analysis.html">分析</a>
                    </li>
                </ul>
            </div>
            <div id="realtime-status" class="text-light">
                <span class="badge bg-secondary">オフライン</span>
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">
        <!-- 期間選択 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">期間選択</h5>
                        <div class="btn-group" role="group" aria-label="期間選択">
                            <button type="button" class="btn btn-outline-primary period-btn" data-period="daily">日次</button>
                            <button type="button" class="btn btn-outline-primary period-btn" data-period="weekly">週次</button>
                            <button type="button" class="btn btn-outline-primary period-btn" data-period="monthly">月次</button>
                            <button type="button" class="btn btn-primary period-btn" data-period="all">全期間</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 時系列取引グラフ -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">時系列取引グラフ</h5>
                        <div class="chart-container" style="position: relative; height:400px;">
                            <canvas id="time-series-chart"></canvas>
                        </div>
                        <div class="mt-3">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="show-buy-trades" checked>
                                <label class="form-check-label" for="show-buy-trades">買い取引</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="show-sell-trades" checked>
                                <label class="form-check-label" for="show-sell-trades">売り取引</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="show-cumulative-pnl" checked>
                                <label class="form-check-label" for="show-cumulative-pnl">累積損益</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 戦略別と取引所別のパフォーマンス比較 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">戦略別パフォーマンス</h5>
                        <div class="chart-container" style="position: relative; height:300px;">
                            <canvas id="strategy-performance-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">取引所別パフォーマンス</h5>
                        <div class="chart-container" style="position: relative; height:300px;">
                            <canvas id="exchange-performance-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 取引量分析 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">時間帯別取引量</h5>
                        <div class="chart-container" style="position: relative; height:300px;">
                            <canvas id="hourly-volume-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">取引サイズ分布</h5>
                        <div class="chart-container" style="position: relative; height:300px;">
                            <canvas id="trade-size-distribution-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 詳細な統計情報 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">統計サマリー</h5>
                        <div class="table-responsive">
                            <table class="table table-striped" id="stats-table">
                                <thead>
                                    <tr>
                                        <th>項目</th>
                                        <th>全体</th>
                                        <th>買い取引</th>
                                        <th>売り取引</th>
                                    </tr>
                                </thead>
                                <tbody id="stats-table-body">
                                    <!-- APIから取得したデータがここに表示されます -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js - index.htmlと同じバージョンを使用 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <!-- Chart.js拡張ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0/dist/chartjs-adapter-moment.min.js"></script>
    
    <!-- Chart.js読み込み確認 -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof Chart !== 'undefined') {
          console.log('Chart.jsが正常に読み込まれました');
        } else {
          console.error('Chart.jsの読み込みに失敗しました');
        }
      });
    </script>

    <!-- カスタムJavaScript -->
    <script src="js/realtime.js"></script>
    <script src="js/analysis.js"></script>
</body>
</html>
