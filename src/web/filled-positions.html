<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>約定済みポジション管理 - Trading Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 text-primary">約定済みポジション管理</h1>
                    <button class="btn btn-outline-primary" onclick="refreshData()">
                        <i class="fas fa-sync"></i> 更新
                    </button>
                </div>

                <!-- 統計情報カード -->
                <div class="row mb-4" id="stats-container">
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h5 class="card-title">約定済みポジション数</h5>
                                <h3 class="text-success" id="total-filled-positions">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h5 class="card-title">総未実現損益</h5>
                                <h3 id="total-unrealized-pnl">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h5 class="card-title">平均保有時間</h5>
                                <h3 class="text-info" id="average-holding-time">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h5 class="card-title">最終更新</h5>
                                <h6 class="text-muted" id="last-updated">-</h6>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- フィルターセクション -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <select class="form-select" id="exchange-filter">
                            <option value="">全ての取引所</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="symbol-filter">
                            <option value="">全ての通貨ペア</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="strategy-filter">
                            <option value="">全ての戦略</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="applyFilters()">フィルター適用</button>
                    </div>
                </div>

                <!-- ポジションテーブル -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">約定済みポジション一覧</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="positions-table">
                                <thead class="table-dark">
                                    <tr>
                                        <th>取引所</th>
                                        <th>通貨ペア</th>
                                        <th>戦略</th>
                                        <th>売買</th>
                                        <th>数量</th>
                                        <th>購入価格</th>
                                        <th>現在価格</th>
                                        <th>未実現損益</th>
                                        <th>損益率</th>
                                        <th>保有時間</th>
                                        <th>約定日時</th>
                                    </tr>
                                </thead>
                                <tbody id="positions-tbody">
                                    <tr>
                                        <td colspan="11" class="text-center">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">読み込み中...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <!-- データテーブル -->
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/filled-positions.js?v=20250617163300"></script>
</body>
</html>
