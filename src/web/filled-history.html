<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取引データ閲覧 - 約定履歴</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- カスタムCSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- データテーブル -->
    <link href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- データテーブル拡張機能 -->
    <link href="https://cdn.datatables.net/buttons/2.3.5/css/buttons.bootstrap5.min.css" rel="stylesheet">
</head>
<body>
    <!-- ナビゲーションバーコンテナ -->
    <div id="navbar-container"></div>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">

        <!-- フィルター -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">検索フィルター</h5>
                        <form id="history-filter-form">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label for="exchange-filter" class="form-label">取引所</label>
                                    <select id="exchange-filter" class="form-select">
                                        <option value="">全て</option>
                                        <!-- APIから取得したデータがここに表示されます -->
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="symbol-filter" class="form-label">銘柄</label>
                                    <select id="symbol-filter" class="form-select">
                                        <option value="">全て</option>
                                        <!-- APIから取得したデータがここに表示されます -->
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="strategy-filter" class="form-label">戦略</label>
                                    <select id="strategy-filter" class="form-select">
                                        <option value="">全て</option>
                                        <!-- APIから取得したデータがここに表示されます -->
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="side-filter" class="form-label">取引方向</label>
                                    <select id="side-filter" class="form-select">
                                        <option value="">全て</option>
                                        <option value="buy">買い</option>
                                        <option value="sell">売り</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="start-date-filter" class="form-label">開始日時</label>
                                    <input type="datetime-local" id="start-date-filter" class="form-control">
                                </div>
                                <div class="col-md-3">
                                    <label for="end-date-filter" class="form-label">終了日時</label>
                                    <input type="datetime-local" id="end-date-filter" class="form-control">
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary me-2">検索</button>
                                    <button type="reset" class="btn btn-secondary">リセット</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 約定履歴テーブル -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">約定履歴</h5>
                        <div class="table-responsive">
                            <table id="filled-trades-history-table" class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>日時</th>
                                        <th>取引所</th>
                                        <th>銘柄</th>
                                        <th>戦略</th>
                                        <th>取引方向</th>
                                        <th>数量</th>
                                        <th>価格</th>
                                        <th>金額</th>
                                        <th>手数料</th> <!-- 新規追加 -->
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- APIから取得したデータがここに表示されます -->
                                </tbody>
                            </table>
                        </div>

                        <!-- ページネーション情報 -->
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <div id="pagination-info">
                                    合計: <span id="total-count">0</span> 件
                                </div>
                            </div>
                            <div class="col-md-6">
                                <nav aria-label="Page navigation">
                                    <ul class="pagination justify-content-end" id="pagination-controls">
                                        <!-- ページネーションコントロールがここに表示されます -->
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript ライブラリ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.1/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.5/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.5/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.5/js/buttons.html5.min.js"></script>

    <!-- カスタムJavaScript -->
    <script src="js/navbar.js"></script>
    <script src="js/realtime.js"></script>
    <script src="js/filled-history.js"></script>
</body>
</html>
