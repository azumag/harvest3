name: Auto PR Closer

on:
  schedule:
    # 毎時間実行して24時間経過したPRをチェック
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  close-old-prs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Close PRs older than 24 hours
        uses: actions/github-script@v7
        with:
          # Personal Access Tokenを使用（設定されていない場合はGITHUB_TOKENを使用）
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            // 24時間前の時刻を計算
            const twentyFourHoursAgo = new Date();
            twentyFourHoursAgo.setHours(twentyFourHoursAgo.getHours() - 24);
            
            // 全てのオープンPRを取得
            const pullRequests = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            console.log(`Found ${pullRequests.data.length} open pull requests`);
            
            for (const pr of pullRequests.data) {
              const createdAt = new Date(pr.created_at);
              
              // 24時間以上経過しているかチェック
              if (createdAt < twentyFourHoursAgo) {
                console.log(`Closing PR #${pr.number} created at ${createdAt.toISOString()}`);
                
                // クローズ理由をコメントで投稿
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: [
                    '🤖 **自動クローズ通知**',
                    '',
                    'このプルリクエストは24時間経過したため自動的にクローズされました。',
                    '',
                    '再度作業が必要な場合は、新しいプルリクエストを作成してください。',
                    '',
                    `作成日時: ${createdAt.toISOString()}`,
                    `クローズ日時: ${new Date().toISOString()}`
                  ].join('\n')
                });
                
                // PRをクローズ
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: 'closed'
                });
                
                console.log(`Successfully closed PR #${pr.number}`);
              } else {
                const hoursOld = Math.round((new Date() - createdAt) / (1000 * 60 * 60));
                console.log(`PR #${pr.number} is ${hoursOld} hours old, keeping open`);
              }
            }
            
            console.log('Auto PR closer completed');
