name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        options: >-
          --health-cmd "echo 'db.runCommand({ping:1}).ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Run unit tests
      run: npm run test:unit
      
    - name: Run integration tests
      run: npm run test:integration
      
    - name: Run full test suite with coverage
      run: npm run test:ci
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Check for vulnerabilities
      run: npm audit --audit-level high

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run performance validation suite
      run: npm run test test/performance/
      
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Verify Docker build
      run: docker build -t harvest3:test .
      
    - name: Test Docker container
      run: |
        docker run --rm -d --name harvest3-test harvest3:test
        sleep 10
        docker logs harvest3-test
        docker stop harvest3-test || true

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Deploy to staging environment
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here

  notify-discord:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [test, security, build, performance]
    if: always() && (needs.test.result == 'failure' || needs.security.result == 'failure' || needs.build.result == 'failure' || needs.performance.result == 'failure')
    
    steps:
    - name: Send Discord notification on CI failure
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        # CI失敗の詳細情報を収集
        FAILED_JOBS=""
        if [[ "${{ needs.test.result }}" == "failure" ]]; then
          FAILED_JOBS="$FAILED_JOBS• Test Suite\\n"
        fi
        if [[ "${{ needs.security.result }}" == "failure" ]]; then
          FAILED_JOBS="$FAILED_JOBS• Security Audit\\n"
        fi
        if [[ "${{ needs.build.result }}" == "failure" ]]; then
          FAILED_JOBS="$FAILED_JOBS• Build Verification\\n"
        fi
        if [[ "${{ needs.performance.result }}" == "failure" ]]; then
          FAILED_JOBS="$FAILED_JOBS• Performance Tests\\n"
        fi

        # Branch情報を取得
        BRANCH_NAME="${{ github.ref_name }}"
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BRANCH_NAME="${{ github.head_ref }}"
        fi

        # Discord Webhookに送信
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{
               \"content\": \"🚨 **CI/CD Pipeline Failed** 🚨\",
               \"embeds\": [{
                 \"title\": \"Failed CI/CD Pipeline\",
                 \"description\": \"**Repository:** ${{ github.repository }}\\n**Branch:** ${BRANCH_NAME}\\n**Commit:** ${{ github.sha }}\\n\\n**Failed Jobs:**\\n${FAILED_JOBS}\",
                 \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                 \"color\": 15158332,
                 \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",
                 \"author\": {
                   \"name\": \"GitHub Actions\",
                   \"icon_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\"
                 },
                 \"footer\": {
                   \"text\": \"Click the title to view the failed workflow\"
                 },
                 \"fields\": [
                   {
                     \"name\": \"Commit Message\",
                     \"value\": \"${{ github.event.head_commit.message || github.event.pull_request.title }}\",
                     \"inline\": false
                   },
                   {
                     \"name\": \"Author\",
                     \"value\": \"${{ github.actor }}\",
                     \"inline\": true
                   }
                 ]
               }]
             }" \
             "$DISCORD_WEBHOOK"