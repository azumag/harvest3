name: CI Failure Detector

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]

jobs:
  auto-trigger-claude-fix:
    name: Auto-trigger Claude CI Fix
    runs-on: ubuntu-latest
    
    # CIが失敗した場合のみ実行
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    
    steps:
      - name: Add CI Failure Label
        uses: actions/github-script@v7
        with:
          script: |
            // Pull Request番号を取得
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open'
            });
            
            if (pullRequests.length === 0) {
              console.log('No open PR found for this branch');
              return;
            }
            
            const prNumber = pullRequests[0].number;
            console.log(`Found PR #${prNumber}`);

            // ci-passedとreview-fixedラベルを削除
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: 'ci-passed'
            }).catch(e => console.log('ci-passed label not found or already removed'));

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: 'review-fixed'
            }).catch(e => console.log('review-fixed label not found or already removed'));
            
            // CI失敗ラベルを追加
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['ci-failure']
            });

            
            console.log(`Added ci-failure label to PR #${prNumber}`);
