name: CI Failure Detector

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]

jobs:
  auto-trigger-claude-fix:
    name: Auto-trigger Claude CI Fix
    runs-on: ubuntu-latest
    
    # CIが失敗した場合のみ実行
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Auto-trigger Claude CI Fix
        uses: actions/github-script@v7
        with:
          script: |
            // Pull Request番号を取得
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open'
            });
            
            if (pullRequests.length === 0) {
              console.log('No open PR found for this branch');
              return;
            }
            
            const prNumber = pullRequests[0].number;
            console.log(`Found PR #${prNumber}`);
            
            // CI失敗通知とClaude起動のコメントを投稿
            const failureMessage = [
              '🚨 **CI/CD Pipeline Failed**',
              '',
              `**Failed Workflow:** ${context.payload.workflow_run.name}`,
              `**Branch:** ${context.payload.workflow_run.head_branch}`,
              `**Commit:** ${context.payload.workflow_run.head_sha}`,
              `**Workflow URL:** ${context.payload.workflow_run.html_url}`,
              '',
              '@claude CIが失敗しました。以下の失敗を修正してください：',
              `- ワークフロー: ${context.payload.workflow_run.name}`,
              `- ワークフローURL: ${context.payload.workflow_run.html_url}`,
              '',
              '失敗の原因を分析し、必要な修正を行ってください。'
            ].join('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: failureMessage
            });
            
            console.log(`Posted CI failure notification and triggered Claude fix for PR #${prNumber}`);
