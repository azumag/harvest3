name: Jest Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      CI: true
      REDIS_URL: redis://localhost:6379
      MONGO_URL: mongodb://localhost:27017
      MONGO_DB_NAME: harvest3_test
    
    strategy:
      matrix:
        node-version: [16.x]
        # You can add more versions if needed like: [14.x, 16.x, 18.x]
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run unit tests
      run: npm test

    - name: Discord notification on failure
      if: failure()
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: '🚨 CI Failed in ${{ github.repository }} on branch ${{ github.ref_name }}'
      
