name: Claude PR Review Resolver

on:
  issue_comment:
    types: [created]

jobs:
  resolve-review:
    name: Resolve PR Review Comments with Claude Code
    runs-on: ubuntu-latest
    
    # PRの「@claude-resolver」メンションがある場合のみ実行
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude-resolver')
    
    timeout-minutes: 30
    
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR information
        id: pr-info
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          HEAD_BRANCH=$(gh pr view $PR_NUMBER --json headRefName --jq '.headRefName')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PR branch
        run: |
          git fetch origin ${{ steps.pr-info.outputs.head_branch }}
          git checkout ${{ steps.pr-info.outputs.head_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Create review summary
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          
          # 一時ディレクトリを作成
          mkdir -p .tmp
          
          # 現在のレビューコメントを収集
          echo "# PR Review Comments Summary" > .tmp/review_summary.md
          echo "" >> .tmp/review_summary.md
          echo "## Latest Comment:" >> .tmp/review_summary.md
          echo "$COMMENT_BODY" >> .tmp/review_summary.md
          echo "" >> .tmp/review_summary.md
          echo "## Recent Reviews:" >> .tmp/review_summary.md
          gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews --jq '.[0:5] | .[] | select(.state == "CHANGES_REQUESTED") | .body' >> .tmp/review_summary.md || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Install dependencies
        run: |
          npm ci || {
            echo "Cache may be corrupted, clearing and retrying..."
            npm cache clean --force
            npm ci
          }

      - name: Resolve review comments with Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            PRのレビューコメントを解決してください。
            
            '.tmp/review_summary.md'ファイルにレビューコメントの詳細があります。すべてのフィードバックに対処するために必要な変更を行ってください。
            
            ガイドライン:
            1. 各レビューコメントを徹底的に対処する
            2. コードの品質と一貫性を保つ
            3. コメントでリファクタリングが提案されている場合は実装する
            4. バグや問題が指摘されている場合は修正する
            5. プロジェクトのコーディング規約に従う（CLAUDE.mdを確認）
            6. 変更後にすべてのテストが通ることを確認する
            
            このリポジトリの開発ガイドライン:
            - YAGNI（You Aren't Gonna Need It）の原則に従う
            - DRY（Don't Repeat Yourself）の原則に従う
            - KISS（Keep It Simple Stupid）の原則に従う
            - 機能を作成する場合は必ず単体テストをセットで作成する
            - 一時的なファイルは.tmpディレクトリに作成する
            
            変更を行った後、各レビューコメントに対処するために何をしたかの簡潔な要約を提供してください。

      - name: Run tests after resolution
        run: |
          echo "=== レビューコメント解決後のテスト実行 ==="
          if ! npm run lint; then
            echo "Linting failed - stopping workflow"
            exit 1
          fi
          if ! npm run test:unit; then
            echo "Unit tests failed - stopping workflow"
            exit 1
          fi
          echo "=== テスト完了 ==="

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain)" ]; then
            # リモートの最新状態を確認
            git fetch origin ${{ steps.pr-info.outputs.head_branch }}
            git rebase origin/${{ steps.pr-info.outputs.head_branch }} || {
              echo "Rebase failed, trying merge instead"
              git merge origin/${{ steps.pr-info.outputs.head_branch }}
            }
            
            git add .
            git commit -m "fix: レビューコメントの対応" \
                       -m "🤖 Generated with Claude Code Action" \
                       -m "Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin ${{ steps.pr-info.outputs.head_branch }}
          else
            echo "No changes to commit"
          fi

      - name: Comment on PR
        if: success()
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          
          gh pr comment $PR_NUMBER --body "✅ Claude Code Actionがレビューコメントを対応しました。

          変更内容をレビューして、適切に対応されているかご確認ください。

          追加の変更が必要な場合は、@claude-resolverメンションでコメントしてください。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Handle failure
        if: failure()
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          
          gh pr comment $PR_NUMBER --body "❌ Claude Code Actionでのレビューコメント対応に失敗しました。

          エラーの詳細は[こちらのワークフロー実行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})をご確認ください。

          手動での対応が必要な可能性があります。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf .tmp