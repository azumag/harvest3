name: Claude CI Fix

on:
  # Pull requestでのCI失敗を検知（commentで起動）
  issue_comment:
    types: [created]

jobs:
  claude-ci-fix:
    name: Fix CI Failures with Claude Code
    runs-on: ubuntu-latest
    
    # コメントで"@claude-fix"が含まれている場合のみ実行
    if: |
      github.event_name == 'issue_comment' && 
      contains(github.event.comment.body, '@claude-fix') &&
      github.event.issue.pull_request
    
    timeout-minutes: 20
    
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requestのHEADブランチをチェックアウト
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Fix CI failures with Claude Code
        id: claude-fix
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Optional: Specify model (defaults to Claude Sonnet 4)
          # model: "claude-opus-4-20250514"
          
          # Allow specific tools for CI fixing
          allowed_tools: "Bash,Read,Write,Edit,MultiEdit,Grep,Glob,LS"
          
          # CI修正のプロンプト
          direct_prompt: |
            このPull RequestのCI/CDが失敗しています。失敗を修正してください。
            
            分析すべき内容：
            1. **リポジトリ**: ${{ github.repository }}
            2. **ブランチ**: ${{ github.head_ref || github.ref_name }}
            3. **コミット**: ${{ github.sha }}
            4. **Pull Request**: ${{ github.event.issue.number }}
            5. **イベント種類**: ${{ github.event_name }}
            
            修正ガイドライン：
            - **テスト失敗**: 失敗したテストを修正するか、実装変更に合わせてテストを更新
            - **Lintエラー**: コードスタイル、未使用変数、フォーマットの問題を修正
            - **型エラー**: TypeScript/Flow型エラーを修正
            - **ビルドエラー**: import問題、依存関係不足、構文エラーを修正
            - **依存関係**: package.jsonに必要なパッケージを追加
            
            このリポジトリの開発ガイドライン：
            - YAGNI（You Aren't Gonna Need It）の原則に従う
            - DRY（Don't Repeat Yourself）の原則に従う
            - KISS（Keep It Simple Stupid）の原則に従う
            - 機能を作成する場合は必ず単体テストをセットで作成する
            - 一時的なファイルは.tmpディレクトリに作成する
            
            CLAUDE.mdの要件を確認し、プロジェクトのコーディング規約に従ってください。
            
            修正が完了したら、何を修正したかの簡潔な要約を提供してください。
          
          # Optional: Allow specific tools for testing and linting
          # allowed_tools: "Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck)"
