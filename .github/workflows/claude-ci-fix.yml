name: Claude CI Fix

on:
  pull_request:
    types: [opened, synchronize]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  fix-ci-failure:
    name: Fix CI Failures with Claude Code
    runs-on: ubuntu-latest
    
    # PRのCIが失敗した場合のみ実行（botによる変更は除外）
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && 
       github.event.pull_request.user.login != 'github-actions[bot]' && 
       !endsWith(github.event.pull_request.user.login, '[bot]'))
    
    timeout-minutes: 30
    
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR information
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # workflow_runイベントの場合はPR情報を取得
            if [ -z "${{ github.event.workflow_run.head_branch }}" ]; then
              echo "No head branch found, skipping workflow"
              echo "skip_workflow=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            PR_NUMBER=$(gh pr list --head ${{ github.event.workflow_run.head_branch }} --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
              echo "Could not find PR for branch, skipping workflow"
              echo "skip_workflow=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            # pull_requestイベントの場合
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          echo "skip_workflow=false" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PR branch
        if: steps.pr-info.outputs.skip_workflow != 'true'
        run: |
          git fetch origin ${{ steps.pr-info.outputs.head_branch }}
          git checkout ${{ steps.pr-info.outputs.head_branch }}

      - name: Setup Node.js
        if: steps.pr-info.outputs.skip_workflow != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Check CI status and create failure summary
        id: ci-check
        run: |
          # 前のステップでskipフラグが設定されている場合は終了
          if [ "${{ steps.pr-info.outputs.skip_workflow }}" == "true" ]; then
            echo "skip_workflow=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          HEAD_BRANCH="${{ steps.pr-info.outputs.head_branch }}"
          
          # PRの最新のCIステータスを確認
          CI_STATUS=$(gh pr view $PR_NUMBER --json statusCheckRollup --jq '.statusCheckRollup[-1].state' 2>/dev/null || echo "UNKNOWN")
          
          # pull_requestイベントの場合、CI失敗がない場合はスキップ
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "$CI_STATUS" != "FAILURE" ]; then
              echo "CI is not failing, skipping workflow"
              echo "skip_workflow=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # 一時ディレクトリを作成
          mkdir -p .tmp
          
          # CI失敗情報を収集
          echo "# CI Failure Analysis" > .tmp/ci_failure_summary.md
          echo "" >> .tmp/ci_failure_summary.md
          echo "## PR Information:" >> .tmp/ci_failure_summary.md
          echo "- PR Number: #$PR_NUMBER" >> .tmp/ci_failure_summary.md
          echo "- Branch: $HEAD_BRANCH" >> .tmp/ci_failure_summary.md
          echo "- CI Status: $CI_STATUS" >> .tmp/ci_failure_summary.md
          echo "" >> .tmp/ci_failure_summary.md
          echo "## Recent CI Failures:" >> .tmp/ci_failure_summary.md
          
          # 詳細な失敗情報を収集
          gh run list --branch "$HEAD_BRANCH" --status failure --limit 3 --json displayTitle,conclusion,url,workflowName | jq -r '.[] | "### \(.workflowName): \(.displayTitle)\n- Status: \(.conclusion)\n- URL: \(.url)\n"' >> .tmp/ci_failure_summary.md 2>/dev/null || echo "Failed to get recent runs" >> .tmp/ci_failure_summary.md
          
          # 最新の失敗ログを取得
          LATEST_FAILED_RUN=$(gh run list --branch "$HEAD_BRANCH" --status failure --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$LATEST_FAILED_RUN" ] && [ "$LATEST_FAILED_RUN" != "null" ]; then
            echo "" >> .tmp/ci_failure_summary.md
            echo "## Latest Failure Log:" >> .tmp/ci_failure_summary.md
            gh run view $LATEST_FAILED_RUN --log-failed | tail -100 >> .tmp/ci_failure_summary.md 2>/dev/null || echo "Could not retrieve failure logs" >> .tmp/ci_failure_summary.md
          fi
          
          # ステータスチェックの詳細を取得
          echo "" >> .tmp/ci_failure_summary.md
          echo "## Status Checks:" >> .tmp/ci_failure_summary.md
          gh pr view $PR_NUMBER --json statusCheckRollup --jq '.statusCheckRollup[] | select(.state == "FAILURE") | "- \(.name): \(.state) - \(.description // "No description")"' >> .tmp/ci_failure_summary.md 2>/dev/null || echo "Could not retrieve status checks" >> .tmp/ci_failure_summary.md
          
          echo "skip_workflow=false" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.ci-check.outputs.skip_workflow != 'true'
        run: |
          npm ci || {
            echo "Cache may be corrupted, clearing and retrying..."
            npm cache clean --force
            npm ci
          }

      - name: Fix CI failures with Claude Code
        if: steps.ci-check.outputs.skip_workflow != 'true'
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Pull RequestのCI/CD失敗を修正してください。
            
            '.tmp/ci_failure_summary.md'ファイルには次の情報が含まれています：
            1. PR情報とCIステータス
            2. 最近の失敗したCIワークフローの一覧
            3. 最新の失敗ログの詳細
            4. 失敗したステータスチェックの詳細
            
            これらの情報を分析し、すべての失敗を修正するために必要な変更を行ってください。
            
            よくあるCI失敗とその解決方法:
            1. **テスト失敗**: 失敗したテストを修正するか、実装が変更された場合はテストを更新
            2. **Lintエラー**: コードスタイルの問題、未使用変数、フォーマットの問題を修正
            3. **型エラー**: TypeScript/Flow型エラーを修正
            4. **ビルドエラー**: importの問題、依存関係の不足、構文エラーを修正
            5. **依存関係不足**: package.jsonに必要なパッケージを追加
            
            ガイドライン:
            1. エラーメッセージを慎重に読み、何が失敗しているかを理解する
            2. 問題を修正するために必要最小限の変更を行う
            3. 失敗の原因でない限り、機能を変更しない
            4. 変更後にすべてのテストが通ることを確認する
            5. プロジェクトのコーディング規約に従う（CLAUDE.mdを確認）
            6. 依存関係のインストールが必要な場合は、package.jsonを適切に更新する
            
            このリポジトリの開発ガイドライン:
            - YAGNI（You Aren't Gonna Need It）の原則に従う
            - DRY（Don't Repeat Yourself）の原則に従う
            - KISS（Keep It Simple Stupid）の原則に従う
            - 機能を作成する場合は必ず単体テストをセットで作成する
            - 一時的なファイルは.tmpディレクトリに作成する
            
            変更を行った後、以下の簡潔な要約を提供してください:
            - 何が失敗していたか、その理由
            - 修正するために行った変更
            - 追加で必要な手順があるか

      - name: Run tests after fix
        if: steps.ci-check.outputs.skip_workflow != 'true'
        run: |
          echo "=== CI修正後のテスト実行 ==="
          if ! npm run lint; then
            echo "Linting failed - stopping workflow"
            exit 1
          fi
          if ! npm run test:unit; then
            echo "Unit tests failed - stopping workflow"
            exit 1
          fi
          echo "=== テスト完了 ==="

      - name: Commit changes
        if: steps.ci-check.outputs.skip_workflow != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain)" ]; then
            # リモートの最新状態を確認
            git fetch origin ${{ steps.pr-info.outputs.head_branch }}
            git rebase origin/${{ steps.pr-info.outputs.head_branch }} || {
              echo "Rebase failed, trying merge instead"
              git merge origin/${{ steps.pr-info.outputs.head_branch }}
            }
            
            git add .
            git commit -m "fix: CI失敗の修正" \
                       -m "🤖 Generated with Claude Code Action" \
                       -m "Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin ${{ steps.pr-info.outputs.head_branch }}
          else
            echo "No changes to commit"
          fi

      - name: Comment on PR
        if: success() && steps.ci-check.outputs.skip_workflow != 'true'
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          
          gh pr comment $PR_NUMBER --body "✅ Claude Code ActionがCI失敗を修正しました。

          変更内容を確認して、CI/CDが正常に動作するかチェックしてください。

          CIがまだ失敗している場合は、このワークフローが再度実行されます。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Handle failure
        if: failure() && steps.ci-check.outputs.skip_workflow != 'true'
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          
          gh pr comment $PR_NUMBER --body "❌ Claude Code ActionでのCI失敗修正に失敗しました。

          エラーの詳細は[こちらのワークフロー実行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})をご確認ください。

          手動での修正が必要な可能性があります。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf .tmp