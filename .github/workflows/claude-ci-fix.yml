name: Claude CI Fix

on:
  repository_dispatch:
    types: [ci-failure]

jobs:
  claude-ci-fix:
    name: Claude CI Fix
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.head_sha }}
          fetch-depth: 0
          
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ github.event.client_payload.pr_number }};
            console.log(`Processing CI fix for PR #${prNumber}`);
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            console.log(`PR branch: ${pr.head.ref}, base: ${pr.base.ref}`);
            return { pr_number: prNumber, head_ref: pr.head.ref, base_ref: pr.base.ref };

      - name: Run Claude Code for CI Fix
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          additional_permissions: |
            actions: read
          
          direct_prompt: |
            CIが失敗しました。PR #${{ github.event.client_payload.pr_number }} の CI 失敗を修正してください：
            
            - ワークフロー結果を確認し、失敗の原因を分析してください
            - 必要な修正を行ってください  
            - 修正後は適切なテストを実行してください
            - 修正が完了したらコミットしてください