name: Claude Issue Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  resolve-issue:
    name: Resolve Issue with Claude Code
    runs-on: ubuntu-latest
    
    # 特定のラベルが付いた場合、または@claude-resolverコメントがある場合に実行
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'claude-resolve') ||
      (github.event.action == 'created' && contains(github.event.comment.body, '@claude-resolver'))
    
    timeout-minutes: 30
    
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Extract issue information
      id: issue-info
      run: |
        echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
        echo "issue_title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
        echo "issue_body=${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
    
    - name: Create issue resolution branch
      run: |
        BRANCH_NAME="claude-resolve-issue-${{ steps.issue-info.outputs.issue_number }}"
        git checkout -b "$BRANCH_NAME"
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
    
    - name: Resolve issue with Claude Code
      uses: anthropics/claude-code-action@beta
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        direct_prompt: |
          Issue #${{ steps.issue-info.outputs.issue_number }}を解決してください。
          
          タイトル: ${{ steps.issue-info.outputs.issue_title }}
          
          説明:
          ${{ steps.issue-info.outputs.issue_body }}
          
          要求事項:
          1. 問題を理解し、適切な解決策を実装してください
          2. 必要に応じて単体テストも作成してください
          3. コードの品質を保ち、既存のコーディング規約に従ってください
          4. 変更内容を簡潔にまとめてください
          
          このリポジトリの開発ガイドライン:
          - YAGNI（You Aren't Gonna Need It）の原則に従う
          - DRY（Don't Repeat Yourself）の原則に従う
          - KISS（Keep It Simple Stupid）の原則に従う
          - 機能を作成する場合は必ず単体テストをセットで作成する
          - 一時的なファイルは.tmpディレクトリに作成する
    
    - name: Run tests after resolution
      run: |
        echo "=== 解決後のテスト実行 ==="
        if ! npm run lint; then
          echo "Linting failed - stopping workflow"
          exit 1
        fi
        if ! npm run test:unit; then
          echo "Unit tests failed - stopping workflow"
          exit 1
        fi
        echo "=== テスト完了 ==="
    
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "fix: Issue #${{ steps.issue-info.outputs.issue_number }}を解決" \
                     -m "Issue: ${{ steps.issue-info.outputs.issue_title }}" \
                     -m "🤖 Generated with Claude Code Action" \
                     -m "Co-Authored-By: Claude <noreply@anthropic.com>"
        else
          echo "No changes to commit"
          exit 0
        fi
    
    - name: Push changes
      run: |
        git push origin "$BRANCH_NAME"
    
    - name: Create Pull Request
      run: |
        cat > pr_body.txt << 'EOF'
        ## 概要
        Issue #${{ steps.issue-info.outputs.issue_number }}の解決案を実装しました。
        
        ## 変更内容
        - Issue「${{ steps.issue-info.outputs.issue_title }}」の解決
        - 必要に応じて単体テストを追加
        - コーディング規約に従った実装
        
        ## テスト状況
        - [x] Lintingが通過することを確認
        - [x] 単体テストが通過することを確認
        
        ## 関連Issue
        Closes #${{ steps.issue-info.outputs.issue_number }}
        
        🤖 Generated with Claude Code Action
        EOF
        
        gh pr create \
          --title "fix: Issue #${{ steps.issue-info.outputs.issue_number }} - ${{ steps.issue-info.outputs.issue_title }}" \
          --body-file pr_body.txt \
          --head "$BRANCH_NAME" \
          --base develop
        
        rm pr_body.txt
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Add comment to issue
      run: |
        PR_NUMBER=$(gh pr list --head $BRANCH_NAME --json number --jq '.[0].number')
        gh issue comment ${{ steps.issue-info.outputs.issue_number }} --body "✅ Claude Code Actionが解決を試みました。

        PR: #${PR_NUMBER}

        この解決案をレビューして、問題が適切に解決されているかご確認ください。"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Handle failure
      if: failure()
      run: |
        gh issue comment ${{ steps.issue-info.outputs.issue_number }} --body "❌ Claude Code Actionでの自動解決に失敗しました。

        エラーの詳細は[こちらのワークフロー実行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})をご確認ください。

        手動での解決が必要な可能性があります。"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}