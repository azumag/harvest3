  #   restart: always
  #   volumes:
  #     - ./src:/usr/src/app/src
  #     - ./strategies:/usr/src/app/strategies
  #     - ./scripts:/usr/src/app/scripts
  #     - ./test:/usr/src/app/test
  #     - ./data:/usr/src/app/data  # データベースファイル用のボリューム
  #     - ./bot.js:/usr/src/app/bot.js
  #     - ./package.json:/usr/src/app/package.json
  #     - .env:/usr/src/app/.env
  #   command: npm run start-mm
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #   networks:
  #     - harvest-network
  #   depends_on:
  #     - redis
  #     - mongodb

  web-ui:
    container_name: trade_viewer
    build:
      context: .
      dockerfile: WebUI.Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./src:/usr/src/app/src:cached
      - ./data:/usr/src/app/data:cached
    depends_on:
      - redis
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_REALTIME=true
      - REDIS_URL=redis://redis:6379
    networks:
      - harvest-network
    command: npm run start-web
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  harvest-network:
    driver: bridge
