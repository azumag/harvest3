services:
  # Redis サービスの追加
  redis:
    image: redis:7-alpine
    container_name: harvest3-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - harvest-network

  bot:
    image: harvest3-bot-image
    build: .
    container_name: scalping_bot
    restart: always
    volumes:
      - ./src:/usr/src/app/src
      - ./strategies:/usr/src/app/strategies
      - ./scripts:/usr/src/app/scripts
      - ./test:/usr/src/app/test
      - ./data:/usr/src/app/data  # データベースファイル用のボリューム
      - ./bot.js:/usr/src/app/bot.js
      - ./package.json:/usr/src/app/package.json
      - .env:/usr/src/app/.env
    command: npm start
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - harvest-network
    depends_on:
      - redis

  hft:
    image: harvest3-bot-image
    container_name: hft_bot
    restart: always
    volumes:
      - ./src:/usr/src/app/src
      - ./strategies:/usr/src/app/strategies
      - ./scripts:/usr/src/app/scripts
      - ./test:/usr/src/app/test
      - ./data:/usr/src/app/data  # データベースファイル用のボリューム
      - ./bot.js:/usr/src/app/bot.js
      - ./package.json:/usr/src/app/package.json
      - .env:/usr/src/app/.env
    command: npm run start-hft
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - harvest-network
    depends_on:
      - redis

  mm:
    image: harvest3-bot-image
    container_name: market_making_bot
    restart: always
    volumes:
      - ./src:/usr/src/app/src
      - ./strategies:/usr/src/app/strategies
      - ./scripts:/usr/src/app/scripts
      - ./test:/usr/src/app/test
      - ./data:/usr/src/app/data  # データベースファイル用のボリューム
      - ./bot.js:/usr/src/app/bot.js
      - ./package.json:/usr/src/app/package.json
      - .env:/usr/src/app/.env
    command: npm run start-mm
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - harvest-network
    depends_on:
      - redis

  web-ui:
    container_name: trade_viewer
    build:
      context: .
      dockerfile: WebUI.Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./src:/usr/src/app/src
      - ./data:/usr/src/app/data
      - ./package.json:/usr/src/app/package.json
      - ./package-lock.json:/usr/src/app/package-lock.json # package-lockも追加
      - .env:/usr/src/app/.env
    depends_on:
      - bot # botサービスが起動してからUIを起動
      - redis
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_REALTIME=true
      - REDIS_URL=redis://redis:6379
    networks:
      - harvest-network
    command: npm run start-web # package.jsonで定義したスクリプトを使用

  # test:
  #   image: harvest3-bot-image
  #   container_name: order_status_test
  #   volumes:
  #     - ./src:/usr/src/app/src
  #     - ./strategies:/usr/src/app/strategies
  #     - ./scripts:/usr/src/app/scripts
  #     - ./test:/usr/src/app/test
  #     - ./data:/usr/src/app/data  # データベースファイル用のボリューム
  #     - ./bot.js:/usr/src/app/bot.js
  #     - ./package.json:/usr/src/app/package.json
  #   command: node test/checkOrderStatus.js

# ボリュームとネットワークの定義を追加
volumes:
  redis_data:
    driver: local

networks:
  harvest-network:
    driver: bridge
