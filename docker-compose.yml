services:
  bot:
    image: harvest3-bot-image
    build: .
    container_name: scalping_bot
    restart: always
    volumes:
      - ./src:/usr/src/app/src
      - ./strategies:/usr/src/app/strategies
      - ./scripts:/usr/src/app/scripts
      - ./test:/usr/src/app/test
      - ./data:/usr/src/app/data  # データベースファイル用のボリューム
      - ./bot.js:/usr/src/app/bot.js
      - ./package.json:/usr/src/app/package.json
      - .env:/usr/src/app/.env
    command: npm start

  hft:
    image: harvest3-bot-image
    container_name: hft_bot
    restart: always
    volumes:
      - ./src:/usr/src/app/src
      - ./strategies:/usr/src/app/strategies
      - ./scripts:/usr/src/app/scripts
      - ./test:/usr/src/app/test
      - ./data:/usr/src/app/data  # データベースファイル用のボリューム
      - ./bot.js:/usr/src/app/bot.js
      - ./package.json:/usr/src/app/package.json
      - .env:/usr/src/app/.env
    command: npm run start-hft

  mm:
    image: harvest3-bot-image
    container_name: market_making_bot
    restart: always
    volumes:
      - ./src:/usr/src/app/src
      - ./strategies:/usr/src/app/strategies
      - ./scripts:/usr/src/app/scripts
      - ./test:/usr/src/app/test
      - ./data:/usr/src/app/data  # データベースファイル用のボリューム
      - ./bot.js:/usr/src/app/bot.js
      - ./package.json:/usr/src/app/package.json
      - .env:/usr/src/app/.env
    command: npm run start-mm

  web-ui:
    container_name: trade_viewer
    build:
      context: .
      dockerfile: WebUI.Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./src:/usr/src/app/src
      - ./data:/usr/src/app/data
      - ./package.json:/usr/src/app/package.json
      - ./package-lock.json:/usr/src/app/package-lock.json # package-lockも追加
    depends_on:
      - bot # botサービスが起動してからUIを起動
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_REALTIME=true
    command: npm run start-web # package.jsonで定義したスクリプトを使用

