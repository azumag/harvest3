  redis:
    image: redis:8-alpine
    container_name: harvest3-redis
    command: redis-server --save 900 1 --save 300 10 --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - harvest-network
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  mongodb:
    image: mongo:7.0
    container_name: harvest3-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - harvest-network
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  bot:
    image: harvest3-bot-image
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: strategy-runner
    restart: always
    env_file:
      - .env
    volumes:
      - ./src:/usr/src/app/src:cached
      - ./strategies:/usr/src/app/strategies:cached  
      - ./scripts:/usr/src/app/scripts:cached
      - ./test:/usr/src/app/test:cached
      - ./data:/usr/src/app/data:cached
    command: npm run start
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - harvest-network
    depends_on:
      - redis
      - mongodb
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  hft:
    image: harvest3-bot-image
    container_name: hft
    restart: unless-stopped
    volumes:
      - ./src:/usr/src/app/src:cached
    command: npm run start-hft
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - harvest-network
    depends_on:
      - redis
      - mongodb
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  backtest:
    image: harvest3-bot-image
    container_name: backtest
    restart: always
    env_file:
      - .env
    volumes:
      - ./src:/usr/src/app/src:cached
      - ./data:/usr/src/app/data:cached
    command: sh -c "while true; do npm run backtest; sleep 500; done"
    # command: sh -c "npm run backtest"
    environment:
      - REDIS_URL=redis://redis:6379
      - BACKTEST_MODE=true
    networks:
      - harvest-network
    depends_on:
      - redis
      - mongodb
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
 
  # mm:
  #   image: harvest3-bot-image
