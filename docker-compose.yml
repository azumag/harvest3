  #   depends_on:
  #     - redis
  #     - mongodb

  web-ui:
    container_name: trade_viewer
    build:
      context: .
      dockerfile: WebUI.Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./src:/usr/src/app/src:cached
      - ./data:/usr/src/app/data:cached
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_REALTIME=true
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongodb:27017/harvest3
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=harvest3
    networks:
      - harvest-network
    command: npm run start-web
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  harvest-network:
    driver: bridge
