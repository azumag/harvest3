  redis:
    image: redis:7-alpine
    container_name: harvest3-redis
    command: redis-server --save 900 1 --save 300 10 --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - harvest-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '2G'
        reservations:
          cpus: '0.25'
          memory: '512M'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  mongodb:
    image: mongo:7.0
    container_name: harvest3-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - harvest-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '4G'
        reservations:
          cpus: '0.5'
          memory: '1G'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  bot:
    image: harvest3-bot-image
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: strategy-runner
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongodb:27017/harvest3
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=harvest3
    volumes:
      - ./src:/usr/src/app/src:cached
      - ./strategies:/usr/src/app/strategies:cached  
      - ./scripts:/usr/src/app/scripts:cached
      - ./test:/usr/src/app/test:cached
      - ./data:/usr/src/app/data:cached
      - ./entrypoint.sh:/usr/src/app/entrypoint.sh:ro
    entrypoint: ["/usr/src/app/entrypoint.sh"]
    # env_fileで.envから読み込み
    networks:
      - harvest-network
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node bot.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  hft:
    image: harvest3-bot-image
    container_name: hft
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./src:/usr/src/app/src:cached
    command: npm run start-hft
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongodb:27017/harvest3
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=harvest3
    networks:
      - harvest-network
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  backtest:
    image: harvest3-bot-image
    container_name: backtest
    restart: on-failure:5
    volumes:
      - ./src:/usr/src/app/src:cached
      - ./data:/usr/src/app/data:cached
      - ./entrypoint.sh:/usr/src/app/entrypoint.sh:ro
    entrypoint: ["/usr/src/app/entrypoint.sh"]
    command: npm run backtest
    # 長時間実行モードに変更: バックテストランナー内部でループを制御
    environment:
      # Core backtest configuration
      - BACKTEST_MODE=true
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongodb:27017/harvest3
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=harvest3
      
      # Discord webhook URLs (minimal necessary variables)
      - DISCORD_ERROR_WEBHOOK_URL=${DISCORD_ERROR_WEBHOOK_URL}
      - DISCORD_BACKTEST_WEBHOOK_URL=${DISCORD_BACKTEST_WEBHOOK_URL}
      - DISCORD_WARNING_WEBHOOK_URL=${DISCORD_WARNING_WEBHOOK_URL}
      
      # Strategy configurations
      - STRATEGY_BOLLINGER_BANDS_ENABLED=true
      - STRATEGY_MARKET_MAKING_ENABLED=true
      - STRATEGY_MA_ENABLED=true
      - STRATEGY_MEAN_REVERSION_ENABLED=true
      - STRATEGY_HIGH_FREQUENCY_ENABLED=true
      - STRATEGY_SCALPING_ENABLED=true
      - STRATEGY_RSI_ENABLED=true
      - STRATEGY_ARBITRAGE_ENABLED=true
      - STRATEGY_MULTI_INDICATOR_ENABLED=true
      - STRATEGY_MACD_ENABLED=true
      - STRATEGY_TREND_FOLLOWING_ENABLED=true
      - STRATEGY_INYO_ENABLED=true
      - STRATEGY_OSCILLATOR_ENABLED=true
    networks:
      - harvest-network
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
 
